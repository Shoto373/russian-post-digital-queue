workflow:
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[skip ci\]/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

stages:
  - test
  - image
  - gitops

default:
  interruptible: true

# ─────────────────────────────────────────────────────────────────────────────
# 1. TEST STAGE
# ─────────────────────────────────────────────────────────────────────────────

frontend:test:
  stage: test
  image: node:22-alpine
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/
  before_script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run typecheck
    - npm test
    - npm run build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - frontend/**/*
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - frontend/**/*
        - .gitlab-ci.yml

backend:test:
  stage: test
  image: golang:1.24-alpine
  variables:
    GOPATH: "$CI_PROJECT_DIR/.go"
  cache:
    key:
      files:
        - backend/go.sum
    paths:
      - .go/pkg/mod/
  before_script:
    - apk add --no-cache git gcc musl-dev
    - cd backend
    - go mod download
  script:
    - go test -v ./internal/...
    - CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o /dev/null ./cmd/api
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - backend/**/*
        - queue_policy.yaml
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - backend/**/*
        - queue_policy.yaml
        - .gitlab-ci.yml

# ─────────────────────────────────────────────────────────────────────────────
# 2. IMAGE BUILD & PUSH STAGE
# ─────────────────────────────────────────────────────────────────────────────

frontend:image:
  stage: image
  image: docker:27-cli
  services:
    - name: docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_BUILDKIT: "1"
  needs:
    - frontend:test
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - frontend/**/*
        - .gitlab-ci.yml
  before_script:
    - |
      if [ -n "$CI_REGISTRY" ] && [ -n "$CI_REGISTRY_IMAGE" ]; then
        echo "Authenticating to GitLab Container Registry: ${CI_REGISTRY}"
        echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
        FRONTEND_REPO="${CI_REGISTRY_IMAGE}/frontend"
      elif [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
        echo "Authenticating to Docker Hub: ${DOCKERHUB_USERNAME}"
        echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
        FRONTEND_REPO="${DOCKERHUB_USERNAME}/queue-frontend"
      else
        echo "No registry credentials provided in CI, defaulting to vacuumxvx/queue-frontend"
        FRONTEND_REPO="vacuumxvx/queue-frontend"
      fi
  script:
    - export FRONTEND_TAG="${CI_COMMIT_SHORT_SHA}"
    - export FULL_IMAGE="${FRONTEND_REPO}:${FRONTEND_TAG}"
    - echo "Building frontend production image ${FULL_IMAGE}..."
    - docker build --pull --tag "${FULL_IMAGE}" --file frontend/Dockerfile.prod frontend
    - echo "Pushing ${FULL_IMAGE}..."
    - docker push "${FULL_IMAGE}"
    - echo "FRONTEND_IMAGE_REPO=${FRONTEND_REPO}" > frontend.env
    - echo "FRONTEND_IMAGE_TAG=${FRONTEND_TAG}" >> frontend.env
  artifacts:
    paths:
      - frontend.env
    expire_in: 1 day

backend:image:
  stage: image
  image: docker:27-cli
  services:
    - name: docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_BUILDKIT: "1"
  needs:
    - backend:test
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - backend/**/*
        - queue_policy.yaml
        - .gitlab-ci.yml
  before_script:
    - |
      if [ -n "$CI_REGISTRY" ] && [ -n "$CI_REGISTRY_IMAGE" ]; then
        echo "Authenticating to GitLab Container Registry: ${CI_REGISTRY}"
        echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
        BACKEND_REPO="${CI_REGISTRY_IMAGE}/backend"
      elif [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
        echo "Authenticating to Docker Hub: ${DOCKERHUB_USERNAME}"
        echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
        BACKEND_REPO="${DOCKERHUB_USERNAME}/queue-backend"
      else
        echo "No registry credentials provided in CI, defaulting to vacuumxvx/queue-backend"
        BACKEND_REPO="vacuumxvx/queue-backend"
      fi
  script:
    - export BACKEND_TAG="${CI_COMMIT_SHORT_SHA}"
    - export FULL_IMAGE="${BACKEND_REPO}:${BACKEND_TAG}"
    - echo "Building backend production image ${FULL_IMAGE}..."
    - docker build --pull --tag "${FULL_IMAGE}" --file backend/Dockerfile backend
    - echo "Pushing ${FULL_IMAGE}..."
    - docker push "${FULL_IMAGE}"
    - echo "BACKEND_IMAGE_REPO=${BACKEND_REPO}" > backend.env
    - echo "BACKEND_IMAGE_TAG=${BACKEND_TAG}" >> backend.env
  artifacts:
    paths:
      - backend.env
    expire_in: 1 day

# ─────────────────────────────────────────────────────────────────────────────
# 3. GITOPS HELM UPDATE STAGE
# ─────────────────────────────────────────────────────────────────────────────

gitops:update:
  stage: gitops
  image: alpine:3.21
  resource_group: gitops-helm-update
  needs:
    - job: frontend:image
      optional: true
      artifacts: true
    - job: backend:image
      optional: true
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - frontend/**/*
        - backend/**/*
        - queue_policy.yaml
        - .gitlab-ci.yml
  before_script:
    - apk add --no-cache git yq
    - PUSH_TOKEN="${GITOPS_PUSH_TOKEN:-${GITLAB_TOKEN:-${CI_JOB_TOKEN}}}"
    - |
      if [ -z "$PUSH_TOKEN" ]; then
        echo "ERROR: GITOPS_PUSH_TOKEN or GITLAB_TOKEN must be configured in GitLab CI/CD Variables with write_repository access."
        exit 1
      fi
  script:
    - UPDATED_SERVICES=""
    - |
      if [ -f frontend.env ]; then
        . ./frontend.env
        echo "Updating Helm values for frontend: ${FRONTEND_IMAGE_REPO}:${FRONTEND_IMAGE_TAG}"
        yq -i '.frontend.image.tag = strenv(FRONTEND_IMAGE_TAG)' helm/queue-chart/values.yaml
        if [ -n "$FRONTEND_IMAGE_REPO" ]; then
          yq -i '.frontend.image.repository = strenv(FRONTEND_IMAGE_REPO)' helm/queue-chart/values.yaml
        fi
        UPDATED_SERVICES="${UPDATED_SERVICES} frontend:${FRONTEND_IMAGE_TAG}"
      fi
    - |
      if [ -f backend.env ]; then
        . ./backend.env
        echo "Updating Helm values for backend: ${BACKEND_IMAGE_REPO}:${BACKEND_IMAGE_TAG}"
        yq -i '.backend.image.tag = strenv(BACKEND_IMAGE_TAG)' helm/queue-chart/values.yaml
        if [ -n "$BACKEND_IMAGE_REPO" ]; then
          yq -i '.backend.image.repository = strenv(BACKEND_IMAGE_REPO)' helm/queue-chart/values.yaml
        fi
        UPDATED_SERVICES="${UPDATED_SERVICES} backend:${BACKEND_IMAGE_TAG}"
      fi
    - |
      if [ -z "$UPDATED_SERVICES" ]; then
        echo "No updated image artifacts found. Nothing to update in Helm values."
        exit 0
      fi
    - |
      if git diff --quiet helm/queue-chart/values.yaml; then
        echo "Helm values.yaml is already up to date. Skipping commit."
        exit 0
      fi
    - git config user.name "gitlab-ci[bot]"
    - git config user.email "gitlab-ci@${CI_SERVER_HOST}"
    - git config --global credential.helper 'store --file=/tmp/git-creds'
    - echo "https://oauth2:${PUSH_TOKEN}@${CI_SERVER_HOST}" > /tmp/git-creds
    - chmod 600 /tmp/git-creds
    - git fetch origin "$CI_DEFAULT_BRANCH"
    - git checkout -B "$CI_DEFAULT_BRANCH" "origin/$CI_DEFAULT_BRANCH"
    - |
      # Re-apply yq changes on the fresh branch checkout
      if [ -f frontend.env ]; then
        . ./frontend.env
        yq -i '.frontend.image.tag = strenv(FRONTEND_IMAGE_TAG)' helm/queue-chart/values.yaml
        if [ -n "$FRONTEND_IMAGE_REPO" ]; then
          yq -i '.frontend.image.repository = strenv(FRONTEND_IMAGE_REPO)' helm/queue-chart/values.yaml
        fi
      fi
      if [ -f backend.env ]; then
        . ./backend.env
        yq -i '.backend.image.tag = strenv(BACKEND_IMAGE_TAG)' helm/queue-chart/values.yaml
        if [ -n "$BACKEND_IMAGE_REPO" ]; then
          yq -i '.backend.image.repository = strenv(BACKEND_IMAGE_REPO)' helm/queue-chart/values.yaml
        fi
      fi
    - git add helm/queue-chart/values.yaml
    - git commit -m "chore(gitops): update Helm image tags${UPDATED_SERVICES} [skip ci]"
    - git push -o ci.skip origin "HEAD:${CI_DEFAULT_BRANCH}"
    - rm -f /tmp/git-creds
